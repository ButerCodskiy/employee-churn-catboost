[project]
name = "employee-churn-catboost"
version = "0.1.0"
description = "Production-grade CatBoost pipeline for Employee Churn Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.5",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "shap>=0.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
